name: CI

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'GitSplit.psd1'
  pull_request:

jobs:
  test:
    name: Pester
    runs-on: ubuntu-latest

    # If the release workflow bumps the version and commits it, we don't want CI to run twice.
    # (We still run tests in the release/publish pipelines.)
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 6.0.0

      - name: Run tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $config = New-PesterConfiguration
          $config.Run.Path = './GitSplit.Tests.ps1'
          $config.Run.Exit = $false
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './GitSplit.psm1'
          $config.CodeCoverage.OutputFormat = 'Cobertura'
          $config.CodeCoverage.OutputPath = './coverage.cobertura.xml'

          $result = Invoke-Pester -Configuration $config

          # GitHub Actions step summary (Markdown rendered on the run page)
          $icon = if ($result.FailedCount -eq 0) { '✅' } else { '❌' }
          @(
              "## $icon Pester Test Results"
              ''
              '| Metric | Count |'
              '| --- | --- |'
              "| Total | $($result.TotalCount) |"
              "| ✅ Passed | $($result.PassedCount) |"
              "| ❌ Failed | $($result.FailedCount) |"
              "| ⏭️ Skipped | $($result.SkippedCount) |"
              "| ⏱️ Duration | $([math]::Round($result.Duration.TotalSeconds, 1))s |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          # Inline annotations for failures — surfaces on PR "Files changed" and Checks tab
          if ($result.FailedCount -gt 0) {
              "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "### ❌ Failed tests" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              foreach ($test in $result.Failed) {
                  $message = $test.ErrorRecord.Exception.Message -replace '\r?\n', ' '
                  $file = $test.ScriptBlock.File
                  $line = $test.ScriptBlock.StartPosition.StartLine
                  "- **$($test.ExpandedPath)** — $message" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                  if ($file -and $line) {
                      Write-Host "::error file=$file,line=$line::$($test.ExpandedPath): $message"
                  }
                  else {
                      Write-Host "::error::$($test.ExpandedPath): $message"
                  }
              }
          }

          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failing test(s)."
          }

      - name: Upload coverage
        if: always()
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.cobertura.xml
          language: PowerShell
          label: code-coverage/pester
          fail-on-error: false
