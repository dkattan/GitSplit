name: CI

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'GitSplit.psd1'
  pull_request:

jobs:
  test:
    name: Pester
    runs-on: ubuntu-latest

    # If the release workflow bumps the version and commits it, we don't want CI to run twice.
    # (We still run tests in the release/publish pipelines.)
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 6.0.0

      - name: Run tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $config = New-PesterConfiguration
          $config.Run.Path = './GitSplit.Tests.ps1'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './GitSplit.psm1'
          $config.CodeCoverage.OutputFormat = 'Cobertura'
          $config.CodeCoverage.OutputPath = './coverage.cobertura.xml'

          Invoke-Pester -Configuration $config

      - name: Upload coverage
        if: always()
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.cobertura.xml
          language: PowerShell
          label: code-coverage/pester
